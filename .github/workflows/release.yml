# 发版 CI：往 release 分支合入「Release vX.Y.Z」PR 的那一刻发版
#
# 工作流（只做 Windows 平台，抄 MAA ci.yml 的实现并精简）：
#   - main 是开发主线；release 分支持续存在、平时不动，
#     只在发版时从 main 拉分支往 release 开 PR
#   - PR 标题「Release vX.Y.Z」即版本号；用 merge commit 合入 release，
#     合并关闭 PR 时触发：
#       meta    从标题提取版本号；严格 X.Y.Z 为正式版，带 -后缀 视为预发布
#       release 在合并提交上：冒烟 → 打包 → 把版号写进包内 version.json →
#               zip 命名 MAA-PRTS-vX.Y.Z-win-<架构>.zip →
#               changelog 取上一个 tag 以来的全部 commits → 发布 Release，
#               tag 打在这次合并提交上
name: Release

on:
  pull_request:
    types: [closed]
    branches: [release]

permissions:
  contents: write

# 连续合并不互相取消，按顺序逐个发版
concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  meta:
    name: 从 PR 标题提取版本
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      prerelease: ${{ steps.set_pre.outputs.prerelease }}
    steps:
      - name: Set tag
        id: set_tag
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          tag=$(printf '%s' "$PR_TITLE" | grep -oE '^Release v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' | sed 's/^Release //')
          if [ -z "$tag" ]; then
            echo "::error::无法从 PR 标题解析版本号：$PR_TITLE（应为「Release vX.Y.Z」）"
            exit 1
          fi
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"

      # 严格 v主.次.修订 为正式版，带 -后缀（如 v2.2.3-beta.1）视为预发布
      - name: Check if it is a pre-release
        id: set_pre
        run: |
          if [[ '${{ steps.set_tag.outputs.tag }}' =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" | tee -a $GITHUB_OUTPUT
          fi

  release:
    name: 构建并发布（Windows）
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      VERSION: ${{ needs.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0 # changelog 需要完整历史与 tag
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --prefer-binary pywebview pythonnet pyinstaller pillow

      - name: Run smoke test
        run: python -u tools/smoketest/smoke_test.py

      - name: Build
        run: python -u tools/build.py

      # 版本号唯一来源是 PR 标题：打包后写进包内 version.json，
      # 程序运行时读它显示版本；没有这个文件的本地构建都是 dev 版。
      # schema 单点定义在 backend/core/version.py 的 app_version()（读侧），
      # 改字段名两边一起动（#63）
      - name: Write version.json
        shell: python
        run: |
          import json, os
          ver = os.environ['VERSION'].lstrip('v')
          with open('build/MAA-PRTS/version.json', 'w', encoding='utf-8') as f:
              json.dump({'version': ver}, f, indent=2)
              f.write('\n')
          print('version.json -> %s' % ver)

      - name: Package zip
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/MAA-PRTS/MAA-PRTS.exe')) { throw 'build/MAA-PRTS/MAA-PRTS.exe 不存在' }
          Copy-Item docs/release-readme.md build/MAA-PRTS/README.md
          $map = @{ 'AMD64' = 'x64'; 'ARM64' = 'arm64'; 'x86' = 'x86' }
          $arch = $map[$env:PROCESSOR_ARCHITECTURE]
          if (-not $arch) { $arch = $env:PROCESSOR_ARCHITECTURE.ToLower() }
          # 压缩包内保留顶层 MAA-PRTS 文件夹（与历史发布包一致），解压即得完整目录。
          # 资产命名契约 MAA-PRTS-<tag>-win-<arch>.zip：appupdate._fallback_asset
          # 按 it 拼兜底下载地址、docs/update.md 有说明，三处一起改（#63）
          $zip = "MAA-PRTS-$env:VERSION-win-$arch.zip"
          Compress-Archive -Path 'build/MAA-PRTS' -DestinationPath $zip
          "ZIP=$zip" | Add-Content $env:GITHUB_ENV
          Get-Item $zip | Select-Object Name, @{ n = 'SizeMB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Generate changelog from commits
        shell: bash
        run: |
          {
            echo "## 更新内容"
            echo
            last=$(git describe --tags --match 'v*' --abbrev=0 --exclude="$VERSION" HEAD 2>/dev/null || true)
            if [ -n "$last" ]; then
              git log --no-merges --pretty=format:'- %h %s' "$last..HEAD"
              echo
              echo
              echo "**Full Changelog**: [$last → $VERSION](https://github.com/$GITHUB_REPOSITORY/compare/$last...$VERSION)"
            else
              git log --no-merges --pretty=format:'- %h %s'
            fi
            # 与历史发布包一致，附压缩包校验值
            echo
            echo "## 校验"
            echo
            echo '```'
            echo "SHA256 ($ZIP) = $(sha256sum "$ZIP" | cut -d' ' -f1)"
            echo '```'
          } > CHANGELOG.md
          cat CHANGELOG.md

      # 合并提交已落在 release 分支上，直接发布；tag 打在该提交上
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          body_path: CHANGELOG.md
          prerelease: ${{ needs.meta.outputs.prerelease != 'false' }}
          files: ${{ env.ZIP }}
